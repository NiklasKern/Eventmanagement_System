<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Header area: admin links, who is logged in, logout. Used by every page with th:replace -->
<div th:fragment="account" class="AccountArea" th:if="${currentUser}">
    <nav class="AdminNav">
        <a th:if="${#sets.contains(permissions, 'MANAGE_ROLES')}" th:href="@{/admin/roles}">Roles</a>
        <a th:if="${#sets.contains(permissions, 'MANAGE_USERS')}" th:href="@{/admin/users}">Users</a>
    </nav>
    <div class="AccountButton">
        <span class="Avatar" th:text="${#strings.toUpperCase(#strings.substring(currentUser, 0, 1))}">A</span>
        <span class="AccountText">
            <span class="AccountLabel">Signed in as</span>
            <span class="AccountName" th:text="${currentUser}">admin</span>
        </span>
    </div>
    <!-- Logout must be a POST with the CSRF token, so it is a small form, not a link -->
    <form th:action="@{/logout}" method="post" class="LogoutForm">
        <button type="submit" class="LogoutButton">Log out</button>
    </form>
</div>
</body>
</html>
