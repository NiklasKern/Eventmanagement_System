<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/styles/cssandjs/colors.css}" rel="stylesheet"/>
    <link th:href="@{/styles/cssandjs/add_event.css}" rel="stylesheet"/>
    <title>Reset password</title>
</head>
<body>
<main class="event-form">
    <h1>Reset password</h1>
    <p class="subtitle" th:text="'New password for ' + ${account.username}">New password for anna</p>

    <form th:action="@{/admin/users/{id}/password(id=${account.id})}" th:object="${passwordForm}" method="post">
        <div class="form-group">
            <label for="newPassword">New password *</label>
            <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required>
            <span class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
        </div>

        <div class="form-group">
            <label for="confirmedPassword">Repeat new password *</label>
            <input type="password" id="confirmedPassword" name="confirmedPassword" autocomplete="new-password" required>
            <span class="error" th:if="${#fields.hasErrors('confirmedPassword')}"
                  th:errors="*{confirmedPassword}"></span>
            <span class="error" th:if="${#fields.hasErrors('passwordConfirmed')}"
                  th:errors="*{passwordConfirmed}"></span>
        </div>

        <button type="submit">Save password</button>
        <a th:href="@{/admin/users}">Cancel</a>
    </form>
</main>
</body>
</html>
