<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Confirmation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .card { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .success { color: #2e7d32; background: #e8f5e9; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .label { font-weight: bold; color: #555; }
        .actions { margin-top: 25px; display: flex; gap: 15px; }
        .btn { text-decoration: none; padding: 10px 16px; border-radius: 5px; background: #1976d2; color: white; }
        .btn-secondary { background: #6c757d; }
    </style>
</head>
<body>
<div class="card">
    <h1>Booking Confirmation</h1>

    <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>

    <div class="row">
        <span class="label">Booking Number:</span>
        <span th:text="${booking.bookingNumber}"></span>
    </div>
    <div class="row" th:if="${booking.created != null}">
        <span class="label">Booking Date:</span>
        <span th:text="${#temporals.format(booking.created, 'dd.MM.yyyy HH:mm')}"></span>
    </div>
    <div class="row">
        <span class="label">Status:</span>
        <span th:text="${booking.eventBookingStatus}"></span>
    </div>
    <div class="row">
        <span class="label">Booking Type:</span>
        <span th:text="${booking.eventBookingType}"></span>
    </div>
    <div class="row">
        <span class="label">Start Time:</span>
        <span th:text="${#temporals.format(booking.eventDate.startTime, 'dd.MM.yyyy HH:mm')}"></span>
    </div>
    <div class="row">
        <span class="label">End Time:</span>
        <span th:text="${#temporals.format(booking.eventDate.endTime, 'dd.MM.yyyy HH:mm')}"></span>
    </div>
    <div class="row">
        <span class="label">Places:</span>
        <span th:text="${booking.places}"></span>
    </div>
    <div class="row">
        <span class="label">Total Price:</span>
        <span th:text="${booking.price + ' EUR'}"></span>
    </div>
    <div class="row">
        <span class="label">Payment Method:</span>
        <span th:text="${booking.paymentMethod}"></span>
    </div>

    <div class="actions">
        <a th:href="@{/customer/bookings}" class="btn">My Bookings</a>
        <a th:href="@{/customer/events}" class="btn btn-secondary">Back to Events</a>
    </div>
</div>
</body>
</html>
