<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/styles/cssandjs/colors.css}" rel="stylesheet"/>
    <link th:href="@{/styles/cssandjs/add_event.css}" rel="stylesheet"/>
    <title>Log in</title>
</head>
<body>
<main class="event-form">
    <h1>Log in</h1>
    <p class="field-error" th:if="${param.error}">Wrong username or password.</p>
    <p class="subtitle" th:if="${param.logout}">You have been logged out.</p>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit">Log in</button>
    </form>
</main>
</body>
</html>
