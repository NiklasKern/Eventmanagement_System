<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Bookings</title>
  <link rel="stylesheet" th:href="@{/styles/cssandjs/colors.css}">
  <link rel="stylesheet" th:href="@{/styles/cssandjs/my_events.css}">
  <link rel="stylesheet" th:href="@{/styles/cssandjs/customer_bookings.css}">
</head>
<body>
<header class="AppHead">
  <div class="HeadContainer">
    <div class="WildPathLogo">
      <img th:src="@{/images/leaf-icon.svg}" alt="leaf">
      <span>WILD</span><span class="primary-green">PATH</span>
    </div>
    <div th:replace="~{fragments/account :: account}"></div>
  </div>
</header>
<div class="container">
  <h1>My Bookings</h1>

  <div th:if="${#lists.isEmpty(bookings)}" class="empty">
    You have no bookings yet.
  </div>

  <table th:if="${!#lists.isEmpty(bookings)}">
    <thead>
    <tr>
      <th>Booking Number</th>
      <th>Booking Date</th>
      <th>Status</th>
      <th>Start Time</th>
      <th>Places</th>
      <th>Total Price</th>
      <th>Confirmation</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="booking : ${bookings}">
      <td th:text="${booking.bookingNumber}"></td>
      <td th:text="${booking.created != null ? #temporals.format(booking.created, 'dd.MM.yyyy HH:mm') : '-'}"></td>
      <td th:text="${booking.eventBookingStatus}"></td>
      <td th:text="${#temporals.format(booking.eventDate.startTime, 'dd.MM.yyyy HH:mm')}"></td>
      <td th:text="${booking.places}"></td>
      <td th:text="${booking.price + ' EUR'}"></td>
      <td>
        <a th:href="@{/customer/booking/{num}(num=${booking.bookingNumber})}" class="btn">
          View Details
        </a>
      </td>
    </tr>
    </tbody>
  </table>

  <a th:href="@{/customer/events}" class="btn btn-secondary">Back to Events</a>
</div>
</body>
</html>
