<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <link th:href="@{/styles/cssandjs/my_events.css}" rel="stylesheet"/>
    <link th:href="@{/styles/cssandjs/add_event.css}" rel="stylesheet"/>
    <link th:href="@{/styles/cssandjs/colors.css}" rel="stylesheet"/>
    <title>Create an Event</title>
</head>

<body>
<main class="event-form">
    <h1>Create an Event</h1>
    <p class="subtitle">Fill in the details to create your event.</p>

    <form th:action="@{/event/manage/create}" th:object="${event}"
          method="post">
        <div class="form-group">
            <label for="name">Event name *</label>
            <input type="text"
                   th:field="*{name}"
                   placeholder="e.g. Summer Party"
                   required>
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group">
            <label>Dates *</label>

            <div class="date-row" th:each="date, stat : *{eventDates}">

                <div class="date-inputs">
                    <span th:text="'Day ' + ${stat.count}">Day 1</span>
                    <input type="datetime-local" th:field="*{eventDates[__${stat.index}__].startTime}">
                    <span>to</span>
                    <input type="datetime-local" th:field="*{eventDates[__${stat.index}__].endTime}">

                    <button type="submit" name="removeDay" th:value="${stat.index}"
                            th:unless="${stat.size == 1}" formnovalidate>− Remove</button>
                </div>

                <div class="date-errors">
            <span class="error"
                  th:if="${#fields.hasErrors('eventDates[__${stat.index}__].startTime')}"
                  th:errors="*{eventDates[__${stat.index}__].startTime}"></span>
                    <span class="error"
                          th:if="${#fields.hasErrors('eventDates[__${stat.index}__].endTime')}"
                          th:errors="*{eventDates[__${stat.index}__].endTime}"></span>
                    <span class="error"
                          th:if="${#fields.hasErrors('eventDates[__${stat.index}__].endTimeValid')}"
                          th:errors="*{eventDates[__${stat.index}__].endTimeValid}"></span>
                </div>

            </div>

            <button type="submit" name="addDay" formnovalidate>+ Add day</button>

            <span class="error"
                  th:if="${#fields.hasErrors('eventDates')}"
                  th:errors="*{eventDates}"></span>
        </div>

        <div class="form-group">
            <label for="location">Location *</label>
            <input type="text"
                   th:field="*{location}"
                   placeholder="e.g. FH Vorarlberg, Hochschulstrasse 1, 6850 Dornbirn, Austria"
                   required>
            <span class="error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></span>
        </div>

        <!-- Value is the category UUID, the name is only shown to the user -->
        <div class="form-group">
            <label for="eventCategoryId">Category *</label>
            <select th:field="*{eventCategoryId}" required>
                <option value="">-- choose a category --</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.categoryName}"></option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('eventCategoryId')}" th:errors="*{eventCategoryId}"></span>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea th:field="*{description}"
                      placeholder="Describe your event..."></textarea>
        </div>

        <div class="form-group">
            <label for="minParticipants">Minimum participants *</label>
            <input type="number"
                   th:field="*{minParticipants}"
                   min="1"
                   placeholder="e.g. 5"
                   required>
            <span class="error" th:if="${#fields.hasErrors('minParticipants')}" th:errors="*{minParticipants}"></span>
        </div>

        <div class="form-group">
            <label for="maxParticipants">Maximum participants *</label>
            <input type="number"
                   th:field="*{maxParticipants}"
                   min="1"
                   placeholder="e.g. 50"
                   required>
            <span class="error" th:if="${#fields.hasErrors('maxParticipantsValid')}" th:errors="*{maxParticipantsValid}"></span>
        </div>

        <div class="form-group">
            <label for="price">Price *</label>
            <input type="number"
                   th:field="*{price}"
                   min="0"
                   step="0.01"
                   placeholder="e.g. 150 &#8364;"
                   required>
            <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
        </div>

        <!-- Each different error message gets shown only once -->
        <p class="field-error"
           th:each="err : ${#sets.toSet(#fields.errors('*'))}"
           th:text="${err}"></p>

        <button type="submit">Create Event</button>

        <p id="message" role="status" aria-live="polite"></p>
    </form>
</main>
</body>
</html>
