# Put this file in the root of the Azure DevOps repo and create a pipeline from it
# (Pipelines > New pipeline > Azure Repos Git > Existing YAML file).
# Add a secret pipeline variable named GITHUB_PAT (Edit > Variables > "Keep this value secret").

trigger:
  branches:
    include:
      - '*'
  tags:
    include:
      - '*'

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    fetchTags: true
    persistCredentials: true   # lets the script fetch all branches from Azure

  - bash: |
      set -euo pipefail

      if [ -z "${GH_PAT:-}" ]; then
        echo "##vso[task.logissue type=error]Secret variable GITHUB_PAT is not set"
        exit 1
      fi

      # Make sure every Azure branch is available as refs/remotes/origin/*
      git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
      git remote set-head origin --delete 2>/dev/null || true

      AUTH=$(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)
      echo "##vso[task.setsecret]$AUTH"

      git remote add github "$GITHUB_URL"

      git -c http.extraheader="AUTHORIZATION: Basic $AUTH" \
        push github "refs/remotes/origin/*:refs/heads/*"

      git -c http.extraheader="AUTHORIZATION: Basic $AUTH" \
        push github --tags
    displayName: Push all branches and tags to GitHub
    env:
      GH_PAT: $(GITHUB_PAT)   # secret variables must be mapped explicitly
      GITHUB_URL: https://github.com/<OWNER>/<REPO>.git   # <-- replace