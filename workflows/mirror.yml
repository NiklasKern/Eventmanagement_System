name: Mirror to Azure DevOps

on:
  push:
    branches:
      - '**' # for all branches, including branch names with slashes
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  to_azure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to Azure DevOps
        env:
          AZURE_URL: "https://nke6545@dev.azure.com/nke6545/FHV_Project/_git/FHV_Project"
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }} # reference secret devops pat
        # 2. run line: create file saved in GitHub built-in tempdir, EQF = here-document marker
        run: |
          git remote add azure "$AZURE_URL"
          cat > "$RUNNER_TEMP/azure-askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "nke6545" ;;
            *Password*) printf '%s\n' "$AZURE_PAT" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/azure-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/azure-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          git push azure --all --force
          git push azure --tags