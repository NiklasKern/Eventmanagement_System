name: build-and-deploy

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/niklaskern/eventmanagement_system

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    #      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tests (Testcontainers-Postgres)
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: GHCR Login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen (und pushen außer bei PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.ENV_NAME }}
            ${{ env.IMAGE }}:${{ github.run_number }}

      - name: Auf VPS deployen
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: dev
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/dev/docker/ems
            docker compose pull ems-${{ env.ENV_NAME }}
            docker compose up -d ems-${{ env.ENV_NAME }}
            docker image prune -f