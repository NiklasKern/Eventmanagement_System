name: Mirror to Azure DevOps

on:
  push:
    branches: ["*"]

jobs:
  to_azure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to Azure DevOps
        env:
          AZURE_URL: "https://nke6545@dev.azure.com/nke6545/FHV_Project/_git/FHV_Project"
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          git remote add azure "$AZURE_URL"
          # Authenticate and push all branches and tags
          git config --global credential.helper store
          echo "https://$AZURE_PAT:$AZURE_PAT@dev.azure.com" > ~/.git-credentials
          git push azure --all --force
          git push azure --tags