name: Mirror to Azure DevOps

on:
  push:
    branches:
      - '**'   # all branches, including names with slashes (feature/x, fix/y/z)
    tags:
      - '**'
  workflow_dispatch:   # manual trigger from the GitHub UI

# Never run two mirror jobs at the same time (avoids racing pushes)
concurrency:
  group: mirror-to-azure
  cancel-in-progress: false

jobs:
  to_azure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + all branches as refs/remotes/origin/*

      - name: Push all branches and tags to Azure DevOps
        env:
          AZURE_ORG: nke6545
          AZURE_PROJECT: FHV_Project
          AZURE_REPO: FHV_Project
          AZURE_USER: nke6545
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${AZURE_PAT:-}" ]; then
            echo "::error::Secret AZURE_DEVOPS_PAT is empty or not available to this workflow"
            exit 1
          fi

          # Strip stray spaces/newlines that sneak in when pasting the secret
          AZURE_PAT=$(printf '%s' "$AZURE_PAT" | tr -d '[:space:]')
          echo "::add-mask::$AZURE_PAT"

          # Check that the PAT can reach the Git repo itself (needs the Code scope)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -u "$AZURE_USER:$AZURE_PAT" \
            "https://dev.azure.com/$AZURE_ORG/$AZURE_PROJECT/_apis/git/repositories/$AZURE_REPO?api-version=7.0")
          case "$STATUS" in
            200) echo "PAT has access to the Azure Git repo" ;;
            401|203|302) echo "::error::PAT cannot access Git (HTTP $STATUS): it most likely lacks the Code (Read & write) scope"; exit 1 ;;
            403) echo "::error::PAT lacks permission on this repo (HTTP 403)"; exit 1 ;;
            404) echo "::error::Repo not found (HTTP 404): check AZURE_PROJECT / AZURE_REPO names"; exit 1 ;;
            *) echo "::error::Unexpected HTTP $STATUS from Azure DevOps"; exit 1 ;;
          esac

          # Fail with a clear message instead of trying to prompt for a username
          export GIT_TERMINAL_PROMPT=0

          # Credentials in the remote URL (the PAT is masked in logs)
          git remote add azure \
            "https://$AZURE_USER:$AZURE_PAT@dev.azure.com/$AZURE_ORG/$AZURE_PROJECT/_git/$AZURE_REPO"

          # Remove origin/HEAD if present, otherwise it would be pushed as a branch called "HEAD"
          git remote set-head origin --delete 2>/dev/null || true

          # Push EVERY GitHub branch (not just the checked-out one) to the same name on Azure.
          # The refspec keeps slashes intact: origin/feature/x -> refs/heads/feature/x
          git push azure "refs/remotes/origin/*:refs/heads/*"
          git push azure --tags